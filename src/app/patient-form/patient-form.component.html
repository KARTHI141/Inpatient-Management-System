<div class="page-header">
  <h2>{{ isEdit ? 'Edit Patient' : 'Register New Patient' }}</h2>
  <a routerLink="/patients" class="btn btn-outline">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
    </svg>
    Back to List
  </a>
</div>

<div *ngIf="error" class="alert alert-danger">{{ error }}</div>

<div class="card">
  <div class="card-body">
    <form (ngSubmit)="onSubmit()" #patientForm="ngForm">
      <div class="form-row">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" class="form-control" [(ngModel)]="patient.name" required placeholder="Enter patient name">
        </div>
        <div class="form-group">
          <label for="age">Age *</label>
          <input type="number" id="age" name="age" class="form-control" [(ngModel)]="patient.age" required min="0" max="150" placeholder="Age">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="gender">Gender *</label>
          <select id="gender" name="gender" class="form-control" [(ngModel)]="patient.gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Others">Others</option>
          </select>
        </div>
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="text" id="phone" name="phone" class="form-control" [(ngModel)]="patient.phone" placeholder="Phone number">
        </div>
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" name="address" class="form-control" [(ngModel)]="patient.address" placeholder="Full address">
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-outline" routerLink="/patients">Cancel</button>
        <button type="submit" class="btn btn-primary">
          {{ isEdit ? 'Update Patient' : 'Register Patient' }}
        </button>
      </div>
    </form>
  </div>
</div>
