<div class="page-header">
  <h2>{{ isEdit ? 'Edit Bill' : 'Create New Bill' }}</h2>
  <a routerLink="/billing" class="btn btn-outline">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
    </svg>
    Back to List
  </a>
</div>

<div *ngIf="error" class="alert alert-danger">{{ error }}</div>

<div class="card">
  <div class="card-body">
    <form (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label>Patient ID *</label>
          <input type="number" class="form-control" [(ngModel)]="record.patientId" name="patientId" required placeholder="Patient ID">
        </div>
        <div class="form-group">
          <label>Patient Name *</label>
          <input type="text" class="form-control" [(ngModel)]="record.patientName" name="patientName" required placeholder="Patient name">
        </div>
      </div>

      <div class="form-group">
        <label>Description *</label>
        <input type="text" class="form-control" [(ngModel)]="record.description" name="description" required placeholder="Bill description (e.g., Consultation, Room charges)">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Amount (&#8377;) *</label>
          <input type="number" class="form-control" [(ngModel)]="record.amount" name="amount" required min="0" step="0.01" placeholder="0.00">
        </div>
        <div class="form-group">
          <label>Billing Date *</label>
          <input type="date" class="form-control" [(ngModel)]="record.billingDate" name="billingDate" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Status *</label>
          <select class="form-control" [(ngModel)]="record.status" name="status" required>
            <option value="PENDING">Pending</option>
            <option value="PAID">Paid</option>
            <option value="OVERDUE">Overdue</option>
          </select>
        </div>
        <div class="form-group">
          <label>Payment Method</label>
          <select class="form-control" [(ngModel)]="record.paymentMethod" name="paymentMethod">
            <option value="">Not Paid</option>
            <option value="CASH">Cash</option>
            <option value="CARD">Card</option>
            <option value="INSURANCE">Insurance</option>
            <option value="UPI">UPI</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-outline" routerLink="/billing">Cancel</button>
        <button type="submit" class="btn btn-primary">{{ isEdit ? 'Update Bill' : 'Create Bill' }}</button>
      </div>
    </form>
  </div>
</div>
